<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FluxHelper — вхід</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238b5cf6' d='M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5z'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#0b0b12;color:#e8eaf2;
  display:flex;align-items:center;justify-content:center;padding:22px;
  background-image:radial-gradient(1000px 500px at 15% -10%,rgba(139,92,246,.22),transparent 60%),
                   radial-gradient(800px 420px at 110% 110%,rgba(99,102,241,.18),transparent 60%)}
.wrap{width:100%;max-width:420px}
.card{background:rgba(22,22,34,.92);border:1px solid rgba(148,163,184,.16);border-radius:24px;
  padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#8b5cf6,#6366f1,#8b5cf6)}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 10px 30px rgba(139,92,246,.45)}
.logo svg{width:34px;height:34px}
h1{font-size:21px;letter-spacing:.2px;margin-bottom:5px}
.sub{font-size:12.5px;color:#9aa0b4;line-height:1.5;margin-bottom:20px}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.st{flex:1;background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.14);border-radius:14px;
  padding:10px 6px;font-size:10.5px;color:#9aa0b4;line-height:1.35}
.st b{display:block;font-size:16px;margin-bottom:3px;color:#8b8fa3}
.st.on{border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.12)}
.st.on b{color:#c4b5fd}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;border:0;cursor:pointer;
  background:#fff;color:#1f2937;font-weight:700;font-size:14.5px;border-radius:14px;padding:14px;
  transition:transform .12s ease,box-shadow .2s ease;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.gbtn:disabled{opacity:.55;cursor:default;transform:none}
.gbtn svg{width:19px;height:19px;flex:none}
.stat{min-height:20px;font-size:12.5px;color:#9aa0b4;margin-top:14px;line-height:1.5}
.stat.err{color:#fda4af}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(196,181,253,.35);
  border-top-color:#c4b5fd;border-radius:50%;vertical-align:-2px;margin-right:6px;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.done-ic{width:64px;height:64px;margin:2px auto 14px;border-radius:50%;display:grid;place-items:center;
  background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.4)}
.done-ic svg{width:30px;height:30px;stroke:#34d399}
.open-btn{width:100%;margin-top:16px;border:0;cursor:pointer;font-weight:700;font-size:14px;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border-radius:14px;padding:13px;
  box-shadow:0 8px 26px rgba(99,102,241,.4)}
.open-btn:hover{filter:brightness(1.08)}
.hint{font-size:11.5px;color:#8b8fa3;margin-top:12px;line-height:1.55}
.foot{margin-top:18px;font-size:11px;color:#6a7089}
.foot a{color:#9aa0b4;text-decoration:none;border-bottom:1px dashed rgba(154,160,180,.4)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <div class="card" id="cardLogin">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path fill="#fff" d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5z"/></svg></div>
    <h1>Вхід у FluxHelper</h1>
    <div class="sub">один акаунт — і твій розклад, групи та налаштування<br>живуть на всіх твоїх пристроях</div>
    <div class="steps">
      <div class="st on" id="st1"><b>1</b>Увійди через Google</div>
      <div class="st" id="st2"><b>2</b>Повернись у застосунок</div>
    </div>
    <button class="gbtn" id="gbtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C40.9 35.6 44 30.3 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Увійти через Google
    </button>
    <div class="stat" id="stat"></div>
  </div>
  <div class="card hidden" id="cardDone">
    <div class="done-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Готово!</h1>
    <div class="sub" id="doneSub">Тепер просто повернись у застосунок FluxHelper —<br>він увійде в акаунт автоматично.</div>
    <button class="open-btn" id="openApp">Відкрити FluxHelper</button>
    <div class="hint" id="doneHint"></div>
  </div>
  <div class="foot">FluxHelper — розклад 8-го Б класу · <a href="https://github.com/matviikobrys2707/FluxHelper/raw/main/latest/FluxHelper.exe">завантажити для ПК</a></div>
</div>
<script>
(function(){
'use strict';
var ACC='fd6013c3a257c7759ff3c15fbb8ac002', DB='89424274-f50b-4931-838e-0d6f384bbc20', CLIENT='668834523935-k470ldmdv0r9am0720v6lgaatm6rtuf3.apps.googleusercontent.com';
var CH=[  "OTwvLgVsFzQiMTA9DA",
  "ANFDBjEjw8DAg0LxYu",
  "Ems0Hy8IPhVqEDYRaQ",
  "AqPTswaWs+aWs5Pz8="];
function tok(){try{var b=atob(CH.join('')),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b.charCodeAt(i)^0x5A);return s;}catch(e){return '';}}
function d1(sql,params){
  return fetch('https://api.cloudflare.com/client/v4/accounts/'+ACC+'/d1/database/'+DB+'/query',{
    method:'POST',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},
    body:JSON.stringify({sql:sql,params:params||[]})
  }).then(function(r){return r.json();}).then(function(j){
    if(j&&j.errors&&j.errors.length)throw new Error(j.errors[0].message);
    if(!j||!j.success)throw new Error('D1 error');
    return j.result[0];
  });
}
function $(i){return document.getElementById(i);}
function stat(t,err){var s=$('stat');s.innerHTML=t;s.className='stat'+(err?' err':'');}
function fail(t){$('gbtn').disabled=false;stat(t,true);}
var k=(new URLSearchParams(location.search).get('k')||'').replace(/[^a-f0-9]/gi,'').toLowerCase();
if(!/^[0-9a-f]{36}$/.test(k))return;            // без робочого ключа — порожня сторінка
$('app').style.display='';
// D1 REST не читається з браузера (CORS preflight 405), але «simple request»
// з Content-Type: text/plain проходить БЕЗ preflight — пишемо «наосліп»,
// а валідація коду (існування/свіжість) відбувається в UPDATE ... WHERE t>...
$('gbtn').disabled=false;
$('gbtn').onclick=go;

function go(){
  if(!window.google||!google.accounts||!google.accounts.oauth2){fail('Google не завантажився — онови сторінку.');return;}
  $('gbtn').disabled=true;
  stat('<span class="spin"></span>відкриваю вікно Google…');
  var tc=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT,scope:'openid email profile',prompt:'',
    callback:function(r){
      if(!r||!r.access_token){fail('Вхід скасовано. Натисни кнопку ще раз.');return;}
      stat('<span class="spin"></span>читаю профіль…');
      fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}})
        .then(function(x){return x.ok?x.json():null;})
        .then(function(p){
          if(!p||!p.sub){fail('Не вдалося прочитати профіль Google.');return;}
          var prof={sub:String(p.sub),name:String(p.name||'Користувач'),email:String(p.email||''),pic:String(p.picture||'')};
          stat('<span class="spin"></span>передаю у застосунок…');
          // «сліпий» запис: свіжий непогашений ключ -> payload (валідація в WHERE)
          var body=JSON.stringify({sql:'UPDATE auth_cb SET payload=? WHERE state=? AND t>? AND payload IS NULL',
                                   params:[JSON.stringify(prof),k,Date.now()-5*60*1000]});
          fetch('https://api.cloudflare.com/client/v4/accounts/'+ACC+'/d1/database/'+DB+'/query',{
            method:'POST',headers:{'Content-Type':'text/plain'},body:body
          }).catch(function(){});
          setTimeout(done,900);   // запис іде «наосліп» — перевірить сам застосунок
        })
        .catch(function(){fail('Не вдалося зв\u2019язатися з Google.');});
    },
    error_callback:function(){fail('Вхід скасовано. Натисни кнопку ще раз.');}
  });
  tc.requestAccessToken();
}
function done(){
  $('cardLogin').classList.add('hidden');
  $('cardDone').classList.remove('hidden');
  $('st2').classList.add('on');
  if(/android|iphone|ipad|mobile/i.test(navigator.userAgent)){
    $('doneSub').innerHTML='Повернись у додаток FluxHelper —<br>він увійде в акаунт автоматично.';
    $('doneHint').textContent='Якщо застосунок не увійшов протягом хвилини — відкрий його і натисни «Увійти» ще раз (код живе 5 хвилин).';
  } else {
    $('doneHint').textContent='Якщо застосунок не увійшов сам — натисни кнопку вище або почни вхід ще раз (код живе 5 хвилин).';
    setTimeout(function(){try{location.replace('fluxhelper://open');}catch(e){}},900);
  }
}
})();
</script>
</body>
</html>
