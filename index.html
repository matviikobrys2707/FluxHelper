<style>
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(99,102,241,.35);color:#e0e7ff}
html,body{min-height:100%}
body{
  font-family:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  color:#f4f4f8;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(540px 360px at 14% -10%, rgba(124,58,237,.17), transparent 68%),
    radial-gradient(580px 400px at 88% 114%, rgba(79,70,229,.14), transparent 66%),
    #050508;
  display:flex;align-items:center;justify-content:center;padding:22px;
}
.card{
  width:430px;max-width:100%;
  background:rgba(17,17,28,.97);
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:34px 30px 28px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  animation:up .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lm{width:74px;height:74px;border-radius:19px;display:block;margin:0 auto 14px;
  box-shadow:0 10px 30px rgba(99,102,241,.45)}
h1{font-size:21px;color:#fff;letter-spacing:.2px}
.brand{font-size:10px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;
  background:linear-gradient(90deg,#a78bfa,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:4px;display:block}
.sub{font-size:13px;color:#a7abc2;line-height:1.55;margin:10px 0 22px}
.sub b{color:#d6d9ea}
.gbtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:11px;
  background:#fff;color:#1f2937;border:none;border-radius:13px;padding:13px 16px;
  font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;
  transition:transform .12s ease,box-shadow .2s ease,opacity .2s;
  box-shadow:0 6px 22px rgba(255,255,255,.08);
}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(255,255,255,.14)}
.gbtn:active{transform:scale(.98)}
.gbtn[disabled]{opacity:.55;pointer-events:none}
.stat{font-size:12.5px;color:#a7abc2;min-height:18px;margin-top:14px;line-height:1.5}
.stat.err{color:#fda4af}
.stat.ok{color:#86efac}
.spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.18);border-top-color:#a78bfa;border-radius:50%;
  display:inline-block;vertical-align:-4px;margin-right:8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pf{display:none;flex-direction:column;align-items:center;gap:3px}
.pf.on{display:flex}
.pf img{width:76px;height:76px;border-radius:50%;border:2.5px solid rgba(139,92,246,.6);
  box-shadow:0 8px 26px rgba(99,102,241,.35);margin-bottom:12px}
.pf b{font-size:16.5px;color:#fff}
.pf span{font-size:13px;color:#a7abc2}
.okmark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;
  background:rgba(34,197,94,.14);border:1.5px solid rgba(74,222,128,.5)}
.ret{margin-top:20px;width:100%;display:none;padding:13px;border:none;border-radius:13px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 8px 26px rgba(99,102,241,.4)}
.ret.on{display:block}
.ret:active{transform:scale(.98)}
.foot{margin-top:18px;font-size:11px;color:#5b5f78;letter-spacing:.3px}
.hint{margin-top:8px;font-size:11.5px;color:#5b5f78;line-height:1.5}
</style>
</head>

    "EuV71vAvs7N9X4NHWvnKwRMl4pO9mGT0Knmiv3/9qqpxWxQ2g44LEnU5CifyMz1ASuZJ73Q/pQHF9YgJXUm3narQUNVZnHkMXx+d"
    "mZnYC4VdlX78u58SY+cm/kJPtfU/P+6LF19/LL9TfoLMyDniS/8vZcpduui0+6eXn15+enkCl/8DPVOd+9LSNi4AAAAASUVORK5C"
    "YII=" alt="FluxHelper">
  <span class="brand">FluxHelper</span>

  <!-- головний екран входу -->
  <div id="vLogin">
    <h1>Вхід у програму</h1>
    <p class="sub">FluxHelper працює з акаунтом Google — так працює <b>синхронізація</b> між пристроями,<br>статистика та оновлення за роллю.</p>
    <button class="gbtn" id="gBtn">
      <svg width="19" height="19" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Увійти через Google
    </button>
    <div class="stat" id="stat"></div>
    <div class="hint" id="hint"></div>

  <!-- успіх -->
  <div class="pf" id="vOk">
    <div class="okmark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <img id="okAva" alt="">
    <b id="okName"></b>
    <span id="okMail"></span>
    <p class="sub" style="margin:14px 0 0">Готово — дані вже передані у програму.<br>Можна повертатися!</p>
    <button class="ret" id="retBtn">Повернутись у FluxHelper</button>
  </div>

  <div class="foot">розклад 8-Б класу · автор Blazix</div>
</div>

<script>
"use strict";
var CID = '668834523935-k470ldmdv0r9am0720v6lgaatm6rtuf3.apps.googleusercontent.com';
var DB_URL = 'https://fluxhelper-1-default-rtdb.europe-west1.firebasedatabase.app';
var qs = new URLSearchParams(location.search);
var STATE = (qs.get('s') || '').replace(/[^A-Za-z0-9]/g, '');
var PLAT = qs.get('p') === 'android' ? 'android' : 'pc';
var statEl = document.getElementById('stat');
var hintEl = document.getElementById('hint');
var gBtn = document.getElementById('gBtn');
var busy = false;

function setStat(t, cls) { statEl.className = 'stat' + (cls ? ' ' + cls : ''); statEl.innerHTML = t || ''; }
function setHint(t) { hintEl.innerHTML = t || ''; }

// немає state -> сторінку відкрито напряму, результат передавати нікуди
if (!STATE) {
  gBtn.style.display = 'none';
  setStat('Ця сторінка — для входу у FluxHelper.', '');
  setHint('Відкрий програму на комп\u2019ютері або телефоні — вона сама приведе тебе сюди.');
} else {
  setHint('Після входу дані автоматично повернуться у програму.');
}

function fail(msg) {
  busy = false;
  gBtn.disabled = false;
  setStat(msg, 'err');
}

function onToken(resp) {
  if (busy) return;
  if (!resp || !resp.access_token) { fail(resp && resp.error ? 'Google: ' + resp.error : 'Не вдалося отримати доступ. Спробуй ще раз.'); return; }
  setStat('<span class="spin"></span>зчитую профіль…');
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (p) {
      if (!p || !p.sub) throw 0;
      deliver({
        token: resp.access_token,
        sub: p.sub,
        name: p.name || 'Користувач',
        email: p.email || '',
        pic: p.picture || '',
        pl: PLAT,
        ts: Date.now()
      });
    })
    .catch(function () { fail('Не вдалося зчитати профіль Google. Спробуй ще раз.'); });
}

function deliver(pay) {
  setStat('<span class="spin"></span>передаю у програму…');
  fetch(DB_URL + '/auth_cb/' + STATE + '.json', { method: 'PUT', body: JSON.stringify(pay) })
    .then(function (r) { if (!r.ok) throw 0; return showOk(pay); })
    .catch(function () { fail('Не вдалося передати дані (немає зв\u2019язку з сервером). Спробуй ще раз.'); });
}

function showOk(pay) {
  busy = true;
  gBtn.style.display = 'none';
  setStat(''); setHint('');
  document.getElementById('vLogin').style.display = 'none';
  var ok = document.getElementById('vOk');
  ok.classList.add('on');
  var ava = document.getElementById('okAva');
  if (pay.pic) { ava.src = pay.pic; } else { ava.style.display = 'none'; }
  document.getElementById('okName').textContent = pay.name;
  document.getElementById('okMail').textContent = pay.email || '';
  var isAndroid = /Android/i.test(navigator.userAgent);
  var rb = document.getElementById('retBtn');
  if (isAndroid) {
    rb.classList.add('on');
    rb.onclick = function () {
      location.href = 'intent://fhauth#Intent;scheme=fluxhelper;package=com.fluxhelper.app;S.browser_fallback_url=' + encodeURIComponent('https://fluxhelper.pages.dev/') + ';end';
    };
  } else {
    rb.classList.add('on');
    rb.textContent = 'Готово';
    rb.onclick = function () { rb.disabled = true; rb.textContent = 'Можна закрити цю вкладку'; };
  }
}

gBtn.addEventListener('click', function () {
  if (busy) return;
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
    setStat('<span class="spin"></span>завантажую Google-вхід…');
    setTimeout(function () { gBtn.click(); }, 800);
    return;
  }
  busy = false;
  gBtn.disabled = true;
  setStat('<span class="spin"></span>відкриваю вікно Google…');
  try {
    var tc = google.accounts.oauth2.initTokenClient({
      client_id: CID,
      scope: 'openid email profile',
      prompt: '',
      callback: onToken,
      error_callback: function (err) {
        fail(err && err.type === 'popup_closed' ? 'Вікно Google закрилось — спробуй ще раз.' : 'Вхід скасовано.');
      }
    });
    tc.requestAccessToken({ prompt: 'select_account' });
  } catch (e) {
    fail('Google-вхід недоступний: ' + (e && e.message ? e.message : 'помилка'));
  }
});

// демо-режим для прев'ю (?demo=1) — нічого не пише в базу
if (qs.get('demo') === '1' && STATE) {
  showOk({ pic: '', name: 'Демо Користувач', email: 'demo@example.com' });
}
</script>
