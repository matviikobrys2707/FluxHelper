<style>
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(99,102,241,.35);color:#e0e7ff}
html,body{min-height:100%}
body{
  font-family:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  color:#f4f4f8;-webkit-font-smoothing:antialiased;
  background:#050508;
  overflow-x:hidden;
}
#root{
  min-height:100vh;min-height:100svh;
  display:flex;padding:22px;
}
/* порожній режим: сторінка без робочого коду — буквально нічого */
body.blank{background:#fff}
body.blank .bg,body.blank #root{display:none}
/* фонові плями */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 16s ease-in-out infinite}
.b1{width:520px;height:520px;left:-140px;top:-160px;background:radial-gradient(circle,rgba(124,58,237,.55),transparent 65%)}
.b2{width:560px;height:560px;right:-180px;bottom:-200px;background:radial-gradient(circle,rgba(79,70,229,.45),transparent 65%);animation-delay:-8s}
.b3{width:340px;height:340px;left:58%;top:-120px;background:radial-gradient(circle,rgba(192,38,211,.28),transparent 65%);animation-delay:-4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(34px,26px) scale(1.06)}66%{transform:translate(-26px,14px) scale(.97)}}

.card{
  position:relative;z-index:1;
  width:460px;max-width:100%;
  margin:auto;               /* ідеальний центр навіть коли картка вища за екран */
  background:rgba(15,15,26,.86);
  border:1px solid rgba(139,92,246,.28);
  border-radius:26px;padding:34px 30px 24px;text-align:center;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;
  animation:up .55s cubic-bezier(.16,1,.3,1) both;
  overflow:hidden;
}
/* світла градієнтна лінія по верхній грані картки */
.card::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.85),transparent);pointer-events:none}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.lm{width:76px;height:76px;border-radius:20px;display:block;margin:0 auto 14px;
  box-shadow:0 12px 34px rgba(99,102,241,.5),0 0 0 1px rgba(255,255,255,.08) inset;
  animation:pop .7s cubic-bezier(.16,1,.3,1) both .1s}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.brand{font-size:10px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;
  background:linear-gradient(90deg,#a78bfa,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;
  color:transparent;margin-bottom:5px;display:block}
h1{font-size:21.5px;color:#fff;letter-spacing:.2px;margin:2px 0 0}
.sub{font-size:13px;color:#a7abc2;line-height:1.55;margin:10px 0 16px}
.sub b{color:#d6d9ea}
/* переваги */
.feats{text-align:left;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.22);
  border-radius:17px;padding:12px 15px 10px;margin:0 0 18px}
.feat{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#c9cbe0;line-height:1.5;padding:4px 0}
.fi{flex:none;width:17px;height:17px;border-radius:50%;background:rgba(52,211,153,.14);
  border:1px solid rgba(74,222,128,.4);display:grid;place-items:center;margin-top:1.5px}
.fi svg{width:9px;height:9px}
.feat b{color:#fff;font-weight:700}
/* кнопка Google */
.gbtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:11px;
  background:#fff;color:#1f2937;border:none;border-radius:14px;padding:14px 16px;
  font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;
  transition:transform .12s ease,box-shadow .2s ease,opacity .2s;
  box-shadow:0 6px 24px rgba(255,255,255,.09);
}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(255,255,255,.15)}
.gbtn:active{transform:scale(.985)}
.gbtn.dis{opacity:.62;pointer-events:none}
.gbtn svg{flex:none}
/* статус / помилки */
.stat{font-size:12.5px;color:#a7abc2;min-height:18px;margin-top:13px;line-height:1.5}
.stat.err{color:#fda4af}
.stat.ok{color:#86efac}
.spin{width:16px;height:16px;border:2.5px solid rgba(5,5,8,.15);border-top-color:#6d28d9;border-radius:50%;
  display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{text-align:left;background:rgba(244,63,94,.09);border:1px solid rgba(244,63,94,.3);
  border-radius:16px;padding:14px 15px 12px;margin-top:4px;animation:up .35s cubic-bezier(.16,1,.3,1) both}
.err-t{font-size:12.5px;color:#fecdd3;line-height:1.5}
.err-row{display:flex;gap:8px;margin-top:10px}
.mini{flex:1;padding:9px 10px;border:none;border-radius:11px;cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);transition:background .15s,transform .1s}
.mini:hover{background:rgba(255,255,255,.14)}
.mini:active{transform:scale(.97)}
.mini.alt{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.45)}
.mini.alt:hover{background:rgba(139,92,246,.32)}
.err-h{font-size:10.5px;color:#8b8fa3;line-height:1.5;margin-top:9px}
.altrow{margin-top:10px}
.altrow .mini{display:block;width:100%}
.hint{margin-top:12px;font-size:11.5px;color:#5b5f78;line-height:1.5}
.foot{margin-top:18px;font-size:11px;color:#4b4f66;letter-spacing:.3px}
/* успіх */
.okmark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:6px auto 14px;
  background:rgba(34,197,94,.14);border:1.5px solid rgba(74,222,128,.5);animation:pop .5s cubic-bezier(.16,1,.3,1) both}
.ok-ava{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 12px;
  border:2.5px solid rgba(139,92,246,.6);box-shadow:0 10px 30px rgba(99,102,241,.4);animation:pop .5s cubic-bezier(.16,1,.3,1) both .08s}
.ok-name{display:block;font-size:17px;color:#fff}
.ok-mail{display:block;font-size:13px;color:#a7abc2;margin-top:3px}
.ok-sub{margin:14px 0 18px}
.ret{width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 10px 30px rgba(99,102,241,.45);
  transition:transform .12s ease,box-shadow .2s ease,opacity .2s}
.ret:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(99,102,241,.55)}
.ret:active{transform:scale(.985)}
.ret:disabled{opacity:.6;pointer-events:none}
@media (max-width:480px){
  body{padding:0}
  #root{padding:14px}
  .card{padding:26px 20px 20px;border-radius:22px}
  .card::before{left:12%;right:12%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
