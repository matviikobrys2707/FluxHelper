<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FluxHelper — веб-версія для всіх пристроїв</title>
<meta name="robots" content="noindex">
<meta name="description" content="FluxHelper — веб-версія для всіх пристроїв: Android, iPhone, Windows, Mac. Розклад уроків 8-Б з посиланнями на Zoom. Вхід захищає Google.">
<link rel="icon" href="/favicon.svg?v=3523" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3523">
<meta name="theme-color" content="#050508">
<script>
/* ============================================================
   FluxHelper 3.5.22 — /main — ЄДИНИЙ URL ВЕБ-ВЕРСІЇ (просив власник:
   «щоб був один URL... якщо заходиш з комп'ютера — відкривається версія
   для комп'ютера, якщо з телефона — версія для телефона»).

   ЯК ПРАЦЮЄ (3.5.22 — БЕЗ переадресації, адреса лишається /main/):
   1) Сторінка сама визначає пристрій:
        • телефон  = сенсорний екран + МАЛИЙ екран (коротша сторона < 700)
          -> відкривається мобільна версія (те саме, що в iPhone/Android);
        • комп'ютер, ПЛАНШЕТ та будь-який ВЕЛИКИЙ екран (коротша сторона
          >= 700 — там усе вміщується) -> комп'ютерна версія;
   2) Потім сторінка підтягує потрібну версію ПРЯМО СЮДИ, в /main/
      (fetch + <base href>), тож у адресному рядку ЗАВЖДИ один URL:
        fluxhelper.pages.dev/main
      Старі адреси /iphone/... і /mac/... більше не існують як окремі
      сторінки — вони лише джерела вмісту, прямий вхід на них
      переадресовує на /main/.
   3) Якщо щось пішло не так (нема fetch/мережі) — звичайна переадресація
      на потрібну версію, сайт усе одно відкриється.
   ============================================================ */
(function () {
  var PHONE = '/iphone/', PC = '/mac/';

  function pickBase() {
    /* телефон = сенсор + малий екран; усе інше (ПК, ноутбук, планшет,
       великий екран) = комп'ютерна версія — «щоб прямо все вміщалось» */
    var coarse = false;
    try { coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    var w = (screen && screen.width) || 0, h = (screen && screen.height) || 0;
    var shortSide = Math.min(w, h) || Math.max(w, h) || 0;
    if (coarse && shortSide && shortSide < 700) return PHONE;   /* телефон */
    return PC;                                                   /* ПК / планшет / великий екран */
  }

  window.__fhMainGo = function (base) {
    /* резервний шлях: звичайна переадресація (якщо підтягнути версію
       сюди не вийшло) — сайт відкриється в будь-якому разі */
    location.replace(base + (location.hash || ''));
  };

  var base = null;
  try { base = pickBase(); } catch (e) { base = PC; }
  var loaded = false;   /* 3.5.26: контент успішно підтягнуто — сторож більше НЕ спрацьовує */

  /* 3.5.23: ЗАХИСТ ВІД ЦИКЛУ ПЕРЕАДРЕСАЦІЙ (власник: «страничка сама
     перезагружается раз за разом»). Раніше було так: /main не зміг
     підтягнути версію -> переадресація на /iphone/ -> та переадресовує
     назад на /main -> знову спроба -> і так по колу на поганій мережі.
     Тепер: 3 ретраї завантаження, а переадресація — ЩОРАЗУ ОДНА за 60 с;
     якщо вже переадресовували й знову тут — показуємо спокійний екран
     «спробуйте ще раз» з кнопкою, БЕЗ циклу. */
  var kicked = false;
  function showRetry() {
    try {
      var p = document.querySelector('p');
      if (p) p.textContent = 'не вдалося завантажити — перевір інтернет і спробуй ще раз';
      var d = document.querySelector('.sp');
      if (d) d.style.display = 'none';
    } catch (eR) {}
  }
  function kick() {
    if (kicked) return;
    try {
      var last = parseInt(sessionStorage.getItem('fh_main_kick') || '0', 10) || 0;
      var now = Date.now();
      if (last && (now - last) < 60000) { kicked = true; showRetry(); return; }
      sessionStorage.setItem('fh_main_kick', String(now));
    } catch (eK) {}
    kicked = true; window.__fhMainGo(base);
  }

  /* страховка: якщо підтягування не вдалося за 12 с — одна переадресація */
  setTimeout(function () { if (!loaded) kick(); }, 12000);   /* 3.5.26: сторож живий ЛИШЕ поки контент не завантажився */

  /* ============================================================
     3.5.45 — ШВИДКИЙ СТАРТ (просив власник: «сайт загружается очень
     долго, сделай так, чтобы он загружался максимально быстро»). Три
     зміни, жодна не ламає APK (він читає свої файли з assets):
     1) PRECONNECT: Firebase/Google гріються ще ДО завантаження версії.
     2) PRELOAD: ui.css + webhost.js + ui.js + logo.png починають
        качатися ПАРАЛЕЛЬНО з index.html версії — раніше браузер
        знаходив їх тільки після document.write (2-3 зайвих RTT).
     3) ?v= — ревізія ассетів: HTML лишається no-cache, а css/js/лого
        кешуються на добу. При зміні ui.js/ui.css/webhost.js/logo.png
        ПІДВИЩУЙ V — нова версия приїде миттєво, без очікування кеша.
     ============================================================ */
  var V = '3545';
  try {
    var hd = document.head;
    var pre = [['ui.css', 'style'], ['webhost.js', 'script'], ['ui.js', 'script'], ['logo.png', 'image']];
    for (var pi = 0; pi < pre.length; pi++) {
      var lk = document.createElement('link');
      lk.rel = 'preload'; lk.as = pre[pi][1];
      lk.href = base + pre[pi][0] + '?v=' + V;
      hd.appendChild(lk);
    }
    [['https://fluxhelper-1-default-rtdb.europe-west1.firebasedatabase.app', 1],
     ['https://securetoken.googleapis.com', 1],
     ['https://accounts.google.com', 0]].forEach(function (pc) {
      var l2 = document.createElement('link');
      l2.rel = 'preconnect'; l2.href = pc[0];
      if (pc[1]) l2.crossOrigin = 'anonymous';
      hd.appendChild(l2);
    });
  } catch (ePre) {}

  function tryLoad(attempt) {
    try {
      fetch(base + 'index.html', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
        .then(function (html) {
          loaded = true;
          /* <base> має стояти ПЕРШИМ у <head> — тоді webhost.js/ui.css/ui.js
             і всі відносні запити підвантажаться з правильної версії */
          html = String(html).replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
          /* 3.5.45: ревізія ассетів — ті самі URL, що вже preload'нуто вище,
             тож css/js/лого беруться з кеша миттєво, без повторного кача */
          html = html
            .replace(/href="ui\.css"/g, 'href="ui.css?v=' + V + '"')
            .replace(/src="webhost\.js"/g, 'src="webhost.js?v=' + V + '"')
            .replace(/src="ui\.js"/g, 'src="ui.js?v=' + V + '"')
            .replace(/src="logo\.png"/g, 'src="logo.png?v=' + V + '"');
          setTimeout(function () {
            document.open();
            document.write(html);
            document.close();
          }, 0);
        })
        .catch(function () {
          if (attempt < 3) setTimeout(function () { tryLoad(attempt + 1); }, 900);
          else kick();
        });
    } catch (e) { if (attempt < 3) setTimeout(function () { tryLoad(attempt + 1); }, 900); else kick(); }
  }
  tryLoad(1);
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh}
body{display:flex;align-items:center;justify-content:center;background:#050508;color:#f4f4f8;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;text-align:center;
  background-image:radial-gradient(560px 380px at 12% -6%,rgba(124,58,237,.22),transparent 65%),
                   radial-gradient(620px 420px at 90% 110%,rgba(79,70,229,.18),transparent 66%)}
img{width:76px;height:76px;border-radius:21px;box-shadow:0 18px 44px rgba(99,102,241,.4)}
h1{font-size:20px;font-weight:800;margin:16px 0 4px}
p{font-size:12.5px;color:#9aa0b4;line-height:1.7}
.sp{width:26px;height:26px;margin:20px auto 0;border-radius:50%;
  border:3px solid rgba(255,255,255,.14);border-top-color:#8b5cf6;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
small{display:block;margin-top:16px;font-size:11px;color:#6b7086}
</style>
</head>
<body>
<div>
  <img src="/icon-192.png?v=3523" alt="FluxHelper">
  <h1>FluxHelper</h1>
  <p>визначаємо пристрій і відкриваємо потрібну версію…</p>
  <div class="sp"></div>
  <small>FluxHelper · розклад 8-Б класу · вхід захищає Google</small>
  <noscript>
    <p><a href="/iphone/">Версія для телефона</a> · <a href="/mac/">Версія для компьютера</a></p>
  </noscript>
</div>

</html>
