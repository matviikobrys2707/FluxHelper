<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FluxHelper — веб-версія для всіх пристроїв</title>
<meta name="robots" content="noindex">
<meta name="description" content="FluxHelper — веб-версія для всіх пристроїв: Android, iPhone, Windows, Mac. Розклад уроків 8-Б з посиланнями на Zoom. Вхід захищає Google.">
<link rel="icon" href="/favicon.svg?v=3522" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3522">
<meta name="theme-color" content="#050508">
<script>
/* ============================================================
   FluxHelper 3.5.22 — /main — ЄДИНИЙ URL ВЕБ-ВЕРСІЇ (просив власник:
   «щоб був один URL... якщо заходиш з комп'ютера — відкривається версія
   для комп'ютера, якщо з телефона — версія для телефона»).

   ЯК ПРАЦЮЄ (3.5.22 — БЕЗ переадресації, адреса лишається /main/):
   1) Сторінка сама визначає пристрій:
        • телефон  = сенсорний екран + МАЛИЙ екран (коротша сторона < 700)
          -> відкривається мобільна версія (те саме, що в iPhone/Android);
        • комп'ютер, ПЛАНШЕТ та будь-який ВЕЛИКИЙ екран (коротша сторона
          >= 700 — там усе вміщується) -> комп'ютерна версія;
   2) Потім сторінка підтягує потрібну версію ПРЯМО СЮДИ, в /main/
      (fetch + <base href>), тож у адресному рядку ЗАВЖДИ один URL:
        fluxhelper.pages.dev/main
      Старі адреси /iphone/... і /mac/... більше не існують як окремі
      сторінки — вони лише джерела вмісту, прямий вхід на них
      переадресовує на /main/.
   3) Якщо щось пішло не так (нема fetch/мережі) — звичайна переадресація
      на потрібну версію, сайт усе одно відкриється.
   ============================================================ */
(function () {
  var PHONE = '/iphone/', PC = '/mac/';

  function pickBase() {
    /* телефон = сенсор + малий екран; усе інше (ПК, ноутбук, планшет,
       великий екран) = комп'ютерна версія — «щоб прямо все вміщалось» */
    var coarse = false;
    try { coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    var w = (screen && screen.width) || 0, h = (screen && screen.height) || 0;
    var shortSide = Math.min(w, h) || Math.max(w, h) || 0;
    if (coarse && shortSide && shortSide < 700) return PHONE;   /* телефон */
    return PC;                                                   /* ПК / планшет / великий екран */
  }

  window.__fhMainGo = function (base) {
    /* резервний шлях: звичайна переадресація (якщо підтягнути версію
       сюди не вийшло) — сайт відкриється в будь-якому разі */
    location.replace(base + (location.hash || ''));
  };

  var base = null;
  try { base = pickBase(); } catch (e) { base = PC; }

  var kicked = false;
  function kick() { if (!kicked) { kicked = true; window.__fhMainGo(base); } }

  /* страховка: якщо підтягування не вдалося за 12 с — переадресуємо */
  setTimeout(kick, 12000);

  try {
    fetch(base + 'index.html', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(function (html) {
        /* <base> має стояти ПЕРШИМ у <head> — тоді webhost.js/ui.css/ui.js
           і всі відносні запити підвантажаться з правильної версії */
        html = String(html).replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
        setTimeout(function () {
          document.open();
          document.write(html);
          document.close();
        }, 0);
      })
      .catch(function () { kick(); });
  } catch (e) { kick(); }
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh}
body{display:flex;align-items:center;justify-content:center;background:#050508;color:#f4f4f8;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;text-align:center;
  background-image:radial-gradient(560px 380px at 12% -6%,rgba(124,58,237,.22),transparent 65%),
                   radial-gradient(620px 420px at 90% 110%,rgba(79,70,229,.18),transparent 66%)}
img{width:76px;height:76px;border-radius:21px;box-shadow:0 18px 44px rgba(99,102,241,.4)}
h1{font-size:20px;font-weight:800;margin:16px 0 4px}

  border:3px solid rgba(255,255,255,.14);border-top-color:#8b5cf6;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
small{display:block;margin-top:16px;font-size:11px;color:#6b7086}
</style>

<div>
  <img src="/icon-192.png?v=3522" alt="FluxHelper">
  <h1>FluxHelper</h1>
  <p>визначаємо пристрій і відкриваємо потрібну версію…</p>
  <div class="sp"></div>
  <small>FluxHelper · розклад 8-Б класу · вхід захищає Google</small>
  <noscript>
    <p><a href="/iphone/">Версія для телефона</a> · <a href="/mac/">Версія для компьютера</a></p>
  </noscript>
</div>
</body>
</html>
