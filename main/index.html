<title>FluxHelper — веб-версія для всіх пристроїв</title>
<meta name="robots" content="noindex">
<meta name="description" content="FluxHelper — веб-версія для всіх пристроїв: Android, iPhone, Windows, Mac. Розклад уроків 8-Б з посиланнями на Zoom. Вхід захищає Google.">
<link rel="icon" href="/favicon.svg?v=3521" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3521">
<meta name="theme-color" content="#050508">
<script>
/* ============================================================
   FluxHelper /main — ГОЛОВНА СТОРІНКА ВЕБ-ВЕРСІЇ ДЛЯ ВСІХ ПРИСТРОЇВ
   (3.5.21, просив власник: «хочу, щоб у програми була веб-версія
   для всіх пристроїв: Android, Windows, iOS і Mac»).

   Як це працює:
   1) /main визначає пристрій (телефон чи комп'ютер);
   2) ставить одноразовий перепустковий прапорець fh_main_ok
      (те саме, що ?demo, але без параметра в адресі — URL чистий);
   3) переадресовує на правильну версію і зберігає хеш вкладки:
        /main#settings  ->  /iphone/#settings   (телефон)
        /main#settings  ->  /mac/#settings      (комп'ютер)
   Вкладки в URL — АНГЛІЙСЬКОЮ: #schedule #settings #account #admin.

   Сторінки перевірки пристрою (/iphone/ лише для iPhone, /mac/ лише
   для Mac) залишаються СУВОРИМИ для прямих посилань — як і було
   (3.5.20). /main — єдиний універсальний вхід для всіх пристроїв.
   ============================================================ */
(function () {
  var go = function (dest) {
    try { sessionStorage.setItem('fh_main_ok', dest); } catch (e) {}
    location.replace(dest + (location.hash || ''));
  };
  try {
    var ua = navigator.userAgent || '';
    var touch = (navigator.maxTouchPoints || 0) > 1;
    var iPhone = /iPhone|iPod/i.test(ua);
    var iPad = /iPad/i.test(ua) || (/Macintosh/i.test(ua) && touch);
    var androidPhone = /Android/i.test(ua) && (/Mobile/i.test(ua) || touch);
    var androidTab = /Android/i.test(ua) && !(/Mobile/i.test(ua));
    if (iPhone || iPad || androidPhone || androidTab) go('/iphone/');   /* телефон/планшет -> мобільна версія */
    else go('/mac/');                                                    /* Windows / Mac / Linux -> комп'ютерна */
  } catch (e) {
    go('/iphone/');
  }
})();
</script>
